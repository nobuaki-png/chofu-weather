<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調布市 天気</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
  :root{--bg:#151515;--surface:rgba(255,255,255,0.04);--surface-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--text:#f0f0f0;--text-dim:#8a8a8a;--text-muted:#4a4a4a;--blue:#5bb8f5;--blue-dim:rgba(91,184,245,0.10);--blue-border:rgba(91,184,245,0.18);--blue-hover:rgba(91,184,245,0.14);--amber:#f5a623;--green:#4ade80;--rain:#5bb8f5;--rain-hi:#ff6b6b;--tab-active-bg:rgba(255,255,255,0.08);--temp-grad-start:#fff;--hilo-color:#666;}
  [data-theme="light"]{--bg:#ffffff;--surface:rgba(0,0,0,0.03);--surface-hover:rgba(0,0,0,0.05);--border:rgba(0,0,0,0.08);--text:#1a1a1a;--text-dim:#777;--text-muted:#bbb;--blue:#2570d4;--blue-dim:rgba(37,112,212,0.07);--blue-border:rgba(37,112,212,0.15);--blue-hover:rgba(37,112,212,0.10);--amber:#c47f0a;--green:#16a34a;--rain:#2570d4;--rain-hi:#dc3545;--tab-active-bg:rgba(0,0,0,0.06);--temp-grad-start:#1a1a1a;--hilo-color:#999;}
  @media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ffffff;--surface:rgba(0,0,0,0.03);--surface-hover:rgba(0,0,0,0.05);--border:rgba(0,0,0,0.08);--text:#1a1a1a;--text-dim:#777;--text-muted:#bbb;--blue:#2570d4;--blue-dim:rgba(37,112,212,0.07);--blue-border:rgba(37,112,212,0.15);--blue-hover:rgba(37,112,212,0.10);--amber:#c47f0a;--green:#16a34a;--rain:#2570d4;--rain-hi:#dc3545;--tab-active-bg:rgba(0,0,0,0.06);--temp-grad-start:#1a1a1a;--hilo-color:#999;}}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Outfit','Noto Sans JP',sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
  .w{max-width:760px;margin:0 auto;padding:20px 24px 16px;position:relative;}
  .tt{position:absolute;top:16px;right:20px;width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;z-index:10;user-select:none;line-height:1;}.tt:hover{background:var(--surface-hover);}

  .hero{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-right:40px;}
  .hero-icon{flex-shrink:0;width:160px;height:160px;}
  .hero-icon img{width:160px;height:160px;}
  .hero-info{flex:1;min-width:0;}
  .hero-city{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:2px;}
  .hero-temp-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .hero-temp{font-size:54px;font-weight:900;line-height:1;letter-spacing:-2px;background:linear-gradient(135deg,var(--temp-grad-start) 30%,var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
  .hero-hilo{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--hilo-color);letter-spacing:-0.5px;white-space:nowrap;}
  .hero-hi{color:var(--amber);}.hero-lo{color:var(--blue);}.hero-sep{font-size:12px;opacity:.4;}
  .hero-desc{font-size:15px;font-weight:500;color:var(--text-dim);margin-top:2px;}
  .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text-dim);font-weight:500;white-space:nowrap;}
  .chip-i{font-size:13px;opacity:.7;}
  .chip-wbgt{background:var(--blue-dim);border-color:var(--blue-border);color:var(--text);}
  .chip-wbgt-l1{background:rgba(91,184,245,0.12);border-color:rgba(91,184,245,0.22);}
  .chip-wbgt-l2{background:rgba(74,222,128,0.12);border-color:rgba(74,222,128,0.25);color:var(--green);}
  .chip-wbgt-l3{background:rgba(245,166,35,0.12);border-color:rgba(245,166,35,0.28);color:var(--amber);}
  .chip-wbgt-l4{background:rgba(255,140,60,0.14);border-color:rgba(255,140,60,0.32);color:#ff8c3c;font-weight:700;}
  .chip-wbgt-l5{background:rgba(255,60,60,0.16);border-color:rgba(255,60,60,0.38);color:#ff5050;font-weight:800;}
  .hr-wbgt{font-size:9px;font-weight:600;color:var(--text-muted);white-space:nowrap;margin-top:1px;}
  .hr-wbgt-l3{color:var(--amber);}.hr-wbgt-l4{color:#ff8c3c;font-weight:700;}.hr-wbgt-l5{color:#ff5050;font-weight:800;}

  .tabs{display:flex;gap:2px;margin-bottom:14px;background:var(--surface);border-radius:10px;padding:3px;}
  .tab{flex:1;text-align:center;font-size:12px;font-weight:600;letter-spacing:0.5px;padding:7px 0;border-radius:8px;cursor:pointer;color:var(--text-muted);transition:all .2s;user-select:none;}.tab:hover{color:var(--text-dim);}.tab-active{background:var(--tab-active-bg);color:var(--text);}
  .panel{display:none;}.panel-active{display:block;animation:panelIn .25s ease-out;}
  @keyframes panelIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

  .hourly-wrap{position:relative;}
  .hourly{display:flex;gap:2px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none;padding-bottom:4px;}.hourly::-webkit-scrollbar{display:none;}
  .hr{min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 10px;border-radius:12px;transition:background .2s;cursor:default;flex-shrink:0;}.hr:hover{background:var(--surface-hover);}
  .hr-now{background:var(--blue-dim);border:1px solid var(--blue-border);}.hr-now:hover{background:var(--blue-hover);}
  .hr-rain-alert{background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.15);}
  .hr-time{font-size:11px;font-weight:600;color:var(--text-dim);}
  .hr-icon{width:52px;height:52px;}.hr-icon img{width:52px;height:52px;}
  .hr-temp{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;}
  .hr-rain{font-size:10px;font-weight:600;color:var(--rain);min-height:16px;white-space:nowrap;}.hr-rain-0{opacity:.3;}.hr-rain-high{color:var(--rain-hi);font-weight:700;}
  .hr-wind{font-size:9px;font-weight:500;color:var(--text-muted);white-space:nowrap;}.hr-wind-strong{color:var(--amber);font-weight:700;}
  .hourly-wrap::after{content:'';position:absolute;top:0;right:0;width:36px;height:100%;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none;}

  .daily{display:flex;flex-direction:column;gap:3px;}
  .dy{display:flex;align-items:center;gap:0;padding:10px 8px;border-radius:12px;transition:background .2s;cursor:default;}.dy:hover{background:var(--surface-hover);}.dy-today{background:var(--surface);}
  .dy-day{width:44px;font-size:14px;font-weight:600;color:var(--text-dim);flex-shrink:0;}.dy-today .dy-day{color:var(--blue);font-weight:800;}
  .dy-icon{width:48px;text-align:center;flex-shrink:0;}.dy-icon img{width:44px;height:44px;vertical-align:middle;}
  .dy-rain{width:40px;font-size:10px;font-weight:500;color:var(--rain);text-align:center;flex-shrink:0;white-space:nowrap;}.dy-rain-0{opacity:.25;}.dy-rain-high{color:var(--rain-hi);font-weight:700;}
  .dy-wbgt{width:44px;font-size:10px;font-weight:600;color:var(--text-muted);text-align:center;flex-shrink:0;white-space:nowrap;}.dy-wbgt-l3{color:var(--amber);}.dy-wbgt-l4{color:#ff8c3c;font-weight:700;}.dy-wbgt-l5{color:#ff5050;font-weight:800;}
  .dy-lo{width:34px;font-size:14px;font-weight:600;color:var(--text-muted);text-align:right;flex-shrink:0;white-space:nowrap;}
  .dy-bar-wrap{flex:1;height:9px;background:var(--surface);border-radius:5px;margin:0 12px;position:relative;overflow:hidden;min-width:60px;}
  .dy-bar{position:absolute;height:100%;border-radius:5px;box-shadow:0 0 6px rgba(245,166,35,0.15);}
  .dy-hi{width:34px;font-size:15px;font-weight:800;color:var(--text);flex-shrink:0;white-space:nowrap;letter-spacing:-0.3px;}

  .foot{display:flex;justify-content:flex-end;align-items:center;margin-top:14px;font-size:10px;color:var(--text-muted);letter-spacing:.5px;}
  .foot-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-right:6px;animation:blink 3s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .loading{padding:24px 0;}.skel{background:var(--surface);border-radius:8px;animation:shimmer 1.5s infinite;}
  @keyframes shimmer{0%{opacity:.4}50%{opacity:.8}100%{opacity:.4}}
  .skel-cur{display:flex;gap:18px;margin-bottom:22px;}.skel-icon{width:160px;height:160px;border-radius:50%;}
  .skel-info{flex:1;display:flex;flex-direction:column;gap:10px;}.skel-city{width:120px;height:12px;}.skel-temp{width:160px;height:44px;}
  .skel-chips{display:flex;gap:6px;}.skel-chip{width:70px;height:24px;border-radius:16px;}
  .skel-tabs{height:36px;border-radius:10px;margin-bottom:14px;}
  .skel-hours{display:flex;gap:4px;}.skel-hr{width:62px;height:100px;border-radius:12px;}
  .err{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;}.err-i{font-size:36px;margin-bottom:12px;opacity:.5;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:480px){.w{padding:14px 16px 12px;}.hero{padding-right:36px;}.hero-icon,.hero-icon img{width:120px;height:120px;}.hero-temp{font-size:42px;}.hero-hilo{font-size:13px;}.hr{min-width:54px;}.hr-icon,.hr-icon img{width:40px;height:40px;}.tt{top:12px;right:14px;}
    .dy{padding:9px 4px;}.dy-day{width:36px;font-size:13px;}.dy-icon{width:40px;}.dy-icon img{width:36px;height:36px;}.dy-rain,.dy-wbgt{width:34px;font-size:9px;}.dy-lo,.dy-hi{width:28px;font-size:13px;}.dy-bar-wrap{margin:0 6px;min-width:36px;height:8px;}}
</style>
</head>
<body>
<div class="w" id="widget">
  <div class="loading">
    <div class="skel-cur"><div class="skel skel-icon"></div><div class="skel-info"><div class="skel skel-city"></div><div class="skel skel-temp"></div><div class="skel-chips"><div class="skel skel-chip"></div><div class="skel skel-chip"></div><div class="skel skel-chip"></div></div></div></div>
    <div class="skel skel-tabs"></div>
    <div class="skel-hours"><div class="skel skel-hr"></div><div class="skel skel-hr"></div><div class="skel skel-hr"></div><div class="skel skel-hr"></div><div class="skel skel-hr"></div><div class="skel skel-hr"></div><div class="skel skel-hr"></div></div>
  </div>
</div>
<script>
var CFG={LAT:35.6528,LON:139.5435,CITY:'調布市',TZ:'Asia%2FTokyo'};
var API_PRIMARY='https://api.open-meteo.com/v1/forecast?latitude='+CFG.LAT+'&longitude='+CFG.LON+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation,is_day&hourly=temperature_2m,weather_code,precipitation_probability,precipitation,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone='+CFG.TZ+'&forecast_days=8';
var API_FALLBACK='https://script.google.com/macros/s/AKfycbytOAbPL_6q-yqc2NFB_LJpm2l2PgLM6KmQgeAyRHtBX-3tJiOzd83pmOBea1mEI1rn/exec';

// amCharts animated SVG icons (Climacons style)
var IBASE='https://www.amcharts.com/wp-content/themes/amcharts4/css/img/icons/weather/animated/';

// WMO Code → [day_icon, night_icon, description]
var WMO={
  0:['day','night','快晴'],
  1:['cloudy-day-1','cloudy-night-1','晴れ'],
  2:['cloudy-day-2','cloudy-night-2','曇りがち'],
  3:['cloudy','cloudy','曇り'],
  45:['cloudy','cloudy','霧'],
  48:['cloudy','cloudy','霧氷'],
  51:['rainy-4','rainy-4','霧雨(弱)'],
  53:['rainy-5','rainy-5','霧雨'],
  55:['rainy-6','rainy-6','霧雨(強)'],
  56:['rainy-7','rainy-7','凍る霧雨'],
  57:['rainy-7','rainy-7','凍る霧雨(強)'],
  61:['rainy-1','rainy-1','小雨'],
  63:['rainy-2','rainy-2','雨'],
  65:['rainy-3','rainy-3','大雨'],
  66:['rainy-7','rainy-7','凍る雨'],
  67:['rainy-7','rainy-7','凍る雨(強)'],
  71:['snowy-1','snowy-1','小雪'],
  73:['snowy-2','snowy-2','雪'],
  75:['snowy-3','snowy-3','大雪'],
  77:['snowy-4','snowy-4','霧雪'],
  80:['rainy-1','rainy-1','にわか雨(弱)'],
  81:['rainy-2','rainy-2','にわか雨'],
  82:['thunder','thunder','にわか雨(激)'],
  85:['snowy-5','snowy-5','にわか雪(弱)'],
  86:['snowy-6','snowy-6','にわか雪(強)'],
  95:['thunder','thunder','雷雨'],
  96:['thunder','thunder','雷雨+雹(弱)'],
  99:['thunder','thunder','雷雨+雹(強)']
};

function gI(code,isDay){var w=WMO[code]||['cloudy','cloudy','不明'];var n=(isDay!==0)?w[0]:w[1];return{src:IBASE+n+'.svg',desc:w[2]};}
var DY=['日','月','火','水','木','金','土'];

// WBGT危険度クラス分け（環境省基準）
function wbgtClass(v){
  if(v>=31)return'chip-wbgt-l5';
  if(v>=28)return'chip-wbgt-l4';
  if(v>=25)return'chip-wbgt-l3';
  if(v>=21)return'chip-wbgt-l2';
  return'chip-wbgt-l1';
}
// 絶対温度→色（気温バー用、青→水色→緑→黄→橙→赤の6段階）
function tempColor(t){
  if(t<=0)return'#1e40af';
  if(t<=8)return'#3b82f6';
  if(t<=16)return'#5bb8f5';
  if(t<=22)return'#4ade80';
  if(t<=27)return'#facc15';
  if(t<=32)return'#f97316';
  return'#ef4444';
}
function wbgtLabelOf(v){
  if(v>=31)return{emoji:'🔴',label:'危険',action:'運動は原則中止'};
  if(v>=28)return{emoji:'🟠',label:'厳重警戒',action:'激しい運動は中止'};
  if(v>=25)return{emoji:'🟡',label:'警戒',action:'積極的に休憩'};
  if(v>=21)return{emoji:'🟢',label:'注意',action:'積極的に水分補給'};
  return{emoji:'🔵',label:'ほぼ安全',action:'通常の注意'};
}
// Open-Meteo時系列にGAS側WBGTをマージ（3時間刻み→最寄り割当 + 日別最大値）
function mergeWbgt(tr,gas){
  if(!gas||!gas.wbgt||!gas.wbgt.available)return tr;
  if(gas.current&&gas.current.wbgt!=null){tr.cur.wbgt=gas.current.wbgt;tr.cur.wbgtLevel=gas.current.wbgtLevel||wbgtLabelOf(gas.current.wbgt);}
  var map={},dayMax={};
  if(gas.hourly){gas.hourly.forEach(function(h){if(h.wbgt==null)return;var k=h.time.substring(0,13),dk=h.time.substring(0,10);map[k]=h.wbgt;if(dayMax[dk]==null||h.wbgt>dayMax[dk])dayMax[dk]=h.wbgt;});}
  tr.hr.forEach(function(r){var k=r.t.substring(0,13);if(map[k]!=null){r.wbgt=map[k];r.wbgtLevel=wbgtLabelOf(map[k]);}});
  tr.dl.forEach(function(x){if(dayMax[x.d]!=null){x.wbgtMax=dayMax[x.d];}});
  return tr;
}

var mT=null;
function gET(){if(mT)return mT;return window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';}
function aT(){var r=document.documentElement;if(mT)r.setAttribute('data-theme',mT);else r.removeAttribute('data-theme');var b=document.getElementById('tb');if(b){var e=gET();b.textContent=e==='dark'?'☀️':'🌙';}}
function tT(){mT=(gET()==='dark')?'light':'dark';aT();}
window.matchMedia('(prefers-color-scheme:light)').addEventListener('change',function(){if(!mT)aT();});

function tx(raw){
  var now=new Date(),p=function(n){return n<10?'0'+n:''+n;};
  var jh=now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate())+'T'+p(now.getHours())+':00';
  var cur={temp:Math.round(raw.current.temperature_2m),fl:Math.round(raw.current.apparent_temperature),hum:raw.current.relative_humidity_2m,ws:raw.current.wind_speed_10m,wc:raw.current.weather_code,prcp:raw.current.precipitation,dy:raw.current.is_day};
  var si=raw.hourly.time.indexOf(jh);if(si===-1)si=0;
  var hr=[];for(var i=si;i<Math.min(si+24,raw.hourly.time.length);i++){hr.push({t:raw.hourly.time[i],tp:Math.round(raw.hourly.temperature_2m[i]),wc:raw.hourly.weather_code[i],pp:raw.hourly.precipitation_probability[i],pr:raw.hourly.precipitation[i],ws:raw.hourly.wind_speed_10m[i],dy:raw.hourly.is_day[i]});}
  var dl=[];for(var j=0;j<Math.min(7,raw.daily.time.length);j++){dl.push({d:raw.daily.time[j],hi:Math.round(raw.daily.temperature_2m_max[j]),lo:Math.round(raw.daily.temperature_2m_min[j]),wc:raw.daily.weather_code[j],pr:raw.daily.precipitation_sum[j]});}
  return{ok:true,cur:cur,hr:hr,dl:dl,at:p(now.getHours())+':'+p(now.getMinutes())};
}

function render(d){
  var el=document.getElementById('widget');
  if(!d.ok){el.innerHTML='<div class="err"><div class="err-i">⚠️</div>データ取得失敗</div>';return;}
  var c=d.cur,ic=gI(c.wc,c.dy),h='',tHi='--',tLo='--';
  if(d.dl.length>0){tHi=d.dl[0].hi;tLo=d.dl[0].lo;}

  h+='<div class="tt" id="tb" onclick="tT()"></div>';
  h+='<div class="hero"><div class="hero-icon"><img src="'+ic.src+'" alt="'+ic.desc+'"></div>';
  h+='<div class="hero-info"><div class="hero-city">'+CFG.CITY+' Weather</div>';
  h+='<div class="hero-temp-row"><div class="hero-temp">'+c.temp+'°C</div>';
  h+='<div class="hero-hilo"><span class="hero-hi">↑'+tHi+'°</span><span class="hero-sep">/</span><span class="hero-lo">↓'+tLo+'°</span></div></div>';
  h+='<div class="hero-desc">'+ic.desc+'</div>';
  h+='<div class="chips"><span class="chip"><span class="chip-i">🌡</span>体感 '+c.fl+'°</span><span class="chip"><span class="chip-i">💧</span>'+c.hum+'%</span><span class="chip"><span class="chip-i">💨</span>'+c.ws+'m/s</span>';
  if(c.prcp>0)h+='<span class="chip"><span class="chip-i">🌧</span>'+c.prcp+'mm</span>';
  if(c.wbgt!=null){var wl=c.wbgtLevel||{emoji:'',label:''};var wc=wbgtClass(c.wbgt);h+='<span class="chip chip-wbgt '+wc+'" title="'+(wl.action||'')+' / 府中観測所"><span class="chip-i">🥵</span>WBGT '+c.wbgt.toFixed(1)+'° '+wl.emoji+wl.label+'</span>';}
  h+='</div></div></div>';

  h+='<div class="tabs"><div class="tab tab-active" data-tab="hourly">1時間予報</div><div class="tab" data-tab="daily">週間予報</div></div>';

  h+='<div class="panel panel-active" id="panel-hourly"><div class="hourly-wrap"><div class="hourly">';
  d.hr.forEach(function(r,i){
    var t=r.t.split('T')[1].substring(0,5),ic2=gI(r.wc,r.dy),isN=(i===0),hasRain=r.pr>0;
    var cls='hr';if(isN)cls+=' hr-now';else if(r.pr>=1)cls+=' hr-rain-alert';
    h+='<div class="'+cls+'"><div class="hr-time">'+(isN?'今':t)+'</div><div class="hr-icon"><img src="'+ic2.src+'" alt="'+ic2.desc+'"></div><div class="hr-temp">'+r.tp+'°</div>';
    if(hasRain){var rc='hr-rain';if(r.pr>=1)rc+=' hr-rain-high';h+='<div class="'+rc+'">🌧'+r.pr+'mm</div>';}
    else{h+='<div class="hr-rain hr-rain-0">&nbsp;</div>';}
    var wc='hr-wind';if(r.ws>=8)wc+=' hr-wind-strong';
    h+='<div class="'+wc+'">💨'+r.ws+'</div>';
    if(r.wbgt!=null){var hwc='hr-wbgt '+wbgtClass(r.wbgt).replace('chip-wbgt-','hr-wbgt-');h+='<div class="'+hwc+'">🥵'+r.wbgt.toFixed(0)+'°</div>';}
    h+='</div>';
  });
  h+='</div></div></div>';

  var aMn=999,aMx=-999;d.dl.forEach(function(x){if(x.lo<aMn)aMn=x.lo;if(x.hi>aMx)aMx=x.hi;});var rg=aMx-aMn||1;
  h+='<div class="panel" id="panel-daily"><div class="daily">';
  d.dl.forEach(function(x,i){
    var dt=new Date(x.d+'T00:00:00+09:00'),lb=(i===0)?'今日':DY[dt.getDay()],ic3=gI(x.wc,1);
    var bl=((x.lo-aMn)/rg)*100,bw=Math.max(((x.hi-x.lo)/rg)*100,6),hasRain=x.pr>0;
    var barGrad='linear-gradient(90deg,'+tempColor(x.lo)+' 0%,'+tempColor((x.lo+x.hi)/2)+' 50%,'+tempColor(x.hi)+' 100%)';
    h+='<div class="dy'+(i===0?' dy-today':'')+'"><div class="dy-day">'+lb+'</div><div class="dy-icon"><img src="'+ic3.src+'" alt="'+ic3.desc+'"></div>';
    if(hasRain){var dc='dy-rain';if(x.pr>=5)dc+=' dy-rain-high';h+='<div class="'+dc+'">🌧'+x.pr+'mm</div>';}
    else{h+='<div class="dy-rain dy-rain-0">&nbsp;</div>';}
    if(x.wbgtMax!=null){var wcd=wbgtClass(x.wbgtMax).replace('chip-wbgt-','dy-wbgt-');h+='<div class="dy-wbgt '+wcd+'">🥵'+Math.round(x.wbgtMax)+'°</div>';}
    else{h+='<div class="dy-wbgt">&nbsp;</div>';}
    h+='<div class="dy-lo">'+x.lo+'°</div><div class="dy-bar-wrap"><div class="dy-bar" style="left:'+bl+'%;width:'+bw+'%;background:'+barGrad+'"></div></div><div class="dy-hi">'+x.hi+'°</div></div>';
  });
  h+='</div></div>';
  h+='<div class="foot"><div class="foot-dot"></div>'+d.at+' 更新 · '+(d.src||'Open-Meteo')+'</div>';

  el.innerHTML=h;el.style.animation='fadeIn .4s ease-out';aT();
  el.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){el.querySelectorAll('.tab').forEach(function(x){x.classList.remove('tab-active');});t.classList.add('tab-active');el.querySelectorAll('.panel').forEach(function(p){p.classList.remove('panel-active');});document.getElementById('panel-'+t.getAttribute('data-tab')).classList.add('panel-active');});});
}

function isDay(hour){return hour>=6&&hour<18?1:0;}

function txGas(gas){
  var now=new Date(),p=function(n){return n<10?'0'+n:''+n;};
  var c=gas.current;
  var cur={temp:c.temp,fl:c.feelsLike,hum:c.humidity,ws:c.windSpeed,wc:c.weatherCode,prcp:c.precipitation,dy:isDay(now.getHours())};
  if(c.wbgt!=null){cur.wbgt=c.wbgt;cur.wbgtLevel=c.wbgtLevel||wbgtLabelOf(c.wbgt);}
  var hr=[];gas.hourly.forEach(function(h){var hh=parseInt(h.time.substring(11,13),10);var item={t:h.time,tp:h.temp,wc:h.weatherCode,pp:h.precipProb,pr:h.precipitation,ws:h.windSpeed,dy:isDay(hh)};if(h.wbgt!=null){item.wbgt=h.wbgt;item.wbgtLevel=h.wbgtLevel||wbgtLabelOf(h.wbgt);}hr.push(item);});
  var dl=[];gas.daily.forEach(function(d){dl.push({d:d.date,hi:d.tempMax,lo:d.tempMin,wc:d.weatherCode,pr:0});});
  return{ok:true,cur:cur,hr:hr,dl:dl,at:gas.updatedAt||p(now.getHours())+':'+p(now.getMinutes()),src:gas.source||'GAS'};
}

// Open-Meteo（天気）と GAS（天気+WBGT）を並行取得。Open-Meteo成功時はそれをベースにGASのWBGTだけマージ。
function jget(url){return fetch(url).then(function(r){return r.json();});}
Promise.allSettled([jget(API_PRIMARY),jget(API_FALLBACK)]).then(function(rs){
  var omR=rs[0],gasR=rs[1];
  var omOk=omR.status==='fulfilled'&&omR.value&&!omR.value.error;
  var gasOk=gasR.status==='fulfilled'&&gasR.value&&gasR.value.success;
  if(omOk){
    var tr=tx(omR.value);
    if(gasOk)tr=mergeWbgt(tr,gasR.value);
    render(tr);
  }else if(gasOk){
    render(txGas(gasR.value));
  }else{
    var msg=(omR.reason&&omR.reason.message)||(gasR.value&&gasR.value.error)||'両API失敗';
    document.getElementById('widget').innerHTML='<div class="err"><div class="err-i">⚠️</div>取得失敗<br><small>'+msg+'</small></div>';
  }
});
</script>
</body>
